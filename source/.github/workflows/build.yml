# SAVE AS: .github/workflows/build.yml
name: Build 3DS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y imagemagick unzip curl git cmake build-essential python3
          dkp-pacman -Syu --noconfirm 3ds-dev
      - name: Make icon, banner, silent audio
        run: |
          convert -size 48x48 xc:'#0b0b1a' -fill '#33ffff' -draw "circle 24,24 24,38" icon.png
          convert -size 256x128 xc:'#0b0b1a' -fill '#33ffff' -draw "circle 128,64 128,96" banner.png
          python3 -c "import wave;w=wave.open('audio.wav','w');w.setnchannels(2);w.setsampwidth(2);w.setframerate(22050);w.writeframes(b'\0'*88200);w.close()"
      - name: Build 3dsx
        run: |
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          make
      - name: Build CIA
        run: |
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          curl -L -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o makerom.zip
          chmod +x makerom && mv makerom /usr/local/bin/
          git clone --recursive https://github.com/carstene1ns/3ds-bannertool.git bt
          cd bt && (cmake -B build . && cmake --build build || make) && cd ..
          cp "$(find bt -name bannertool -type f | head -1)" /usr/local/bin/
          bannertool makebanner -i banner.png -a audio.wav -o banner.bnr
          set -e
          makerom -f cia -o neonswarm.cia -elf neonswarm.elf -rsf app.rsf -icon neonswarm.smdh -banner banner.bnr -exefslogo -target t
      - uses: actions/upload-artifact@v4
        with:
          name: neonswarm-cia
          path: neonswarm.cia
          if-no-files-found: error
